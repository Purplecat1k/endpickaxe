name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip
      run: unzip endpickaxe.zip
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build
      run: cd endpickaxe && chmod +x gradlew && ./gradlew build
    - uses: actions/upload-artifact@v4
      with:
        name: endpickaxe-jar
        path: endpickaxe/build/libs/*.jar
