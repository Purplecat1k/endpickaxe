name: Build Mod
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip endpickaxe.zip

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Fix settings.gradle
        working-directory: endpickaxe
        run: |
          cat > pluginManagement.tmp <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = "https://maven.fabricmc.net/" }
                  gradlePluginPortal()
              }
          }
          EOF
          cat pluginManagement.tmp settings.gradle > temp.gradle
          mv temp.gradle settings.gradle
          rm pluginManagement.tmp

      - name: Build
        working-directory: endpickaxe
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: endpickaxe-jar
          path: "endpickaxe/build/libs/*.jar"
