name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip
      run: unzip endpickaxe.zip
    - uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
    - name: Fix settings.gradle
      run: |
        cd endpickaxe
        echo 'pluginManagement {
          repositories {
            maven { url = "https://maven.fabricmc.net/" }
            gradlePluginPortal()
          }
        }' | cat - settings.gradle > temp && mv temp settings.gradle
    - name: Build
      run: cd endpickaxe && gradle build
    - uses: actions/upload-artifact@v4
      with:
        name: endpickaxe-jar
        path: "endpickaxe/build/libs/*.jar"
